user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Large encrypted uploads stream through rather than buffering to disk.
    client_max_body_size      100m;
    client_body_buffer_size   256k;
    client_body_timeout       60s;
    client_header_timeout     20s;
    send_timeout              120s;
    proxy_read_timeout        120s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    # Never gzip file downloads: they are already encrypted/compressed and
    # mixing compression with secrets invites BREACH-style attacks.
    gzip_proxied off;

    # --- Rate limiting zones -------------------------------------------------
    # Shared with (not a replacement for) the DRF throttles: this is the cheap
    # outer layer that sheds load before it reaches Python.
    limit_req_zone  $binary_remote_addr zone=api_general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m     rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api_share:10m    rate=20r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream secureshare_frontend {
        server frontend:8080 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    upstream secureshare_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
