# ---------------------------------------------------------------------------
# HTTP :80 - health probe + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Container healthcheck; must not be redirected.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# HTTPS :443 - the real entrypoint
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2+ only, forward-secret suites only.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --- Security headers (belt and braces with the Django middleware) ------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    limit_conn perip 24;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    # Never let a client forge the header Django trusts for TLS detection.
    proxy_set_header X-Forwarded-Ssl   "";

    # --- Auth endpoints: strictest limit ------------------------------------
    location ~ ^/api/auth/(login|register|password-reset) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://secureshare_api;
    }

    # --- Public share links: tight limit, no caching, no referrer leakage ----
    location ~ ^/api/share/ {
        limit_req zone=api_share burst=10 nodelay;
        # Downloads are streamed; buffering would hold whole files in nginx.
        proxy_buffering off;
        proxy_request_buffering off;
        add_header Cache-Control "no-store, private" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://secureshare_api;
    }

    # --- Uploads and authenticated downloads --------------------------------
    location ~ ^/api/files/.*/(upload|download)/?$ {
        limit_req zone=api_general burst=20;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://secureshare_api;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://secureshare_api;
    }

    location /static/ {
        proxy_pass http://secureshare_api;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # The encrypted object store is NEVER served by nginx. Ciphertext only
    # leaves through the API, which checks authorization and decrypts.
    location /storage/ { deny all; return 404; }
    location ~ /\.      { deny all; return 404; }

    # --- React single-page application --------------------------------------
    # Served by the frontend container. The SPA history fallback lives there,
    # so a refresh on /files/<uuid> or /s/<token> still boots the router.
    # This block is last: every /api, /static and /storage rule above wins.
    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://secureshare_frontend;
    }
}
