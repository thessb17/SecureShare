[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --ds beats an exported DJANGO_SETTINGS_MODULE; the ini key above is only a
# default. Without it, a developer who has sourced the project .env would
# silently run the whole suite against config.settings.dev (DEBUG on, real
# Redis, production CORS) and the results would not mean what they appear to.
addopts =
    -ra
    --strict-markers
    --durations=10
    --ds=config.settings.test
markers =
    crypto: cryptographic engine tests
    security: security control tests
    integration: end-to-end workflow tests
    slow: longer running tests
filterwarnings =
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:kombu.*
