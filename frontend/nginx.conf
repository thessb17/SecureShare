# ---------------------------------------------------------------------------
# Static file server for the built React bundle.
#
# This sits BEHIND the edge proxy, which terminates TLS, applies the security
# headers and routes /api to Django. This server only answers for the SPA, so
# it deliberately does not duplicate TLS or API concerns.
#
# Unprivileged port: the container runs as uid 101, which cannot bind :80.
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames (app-ab12cd34.js), so these are
    # safe to cache permanently. index.html must never be cached or clients
    # keep booting an old bundle after a deploy.
    # ^~ stops nginx from then evaluating the regex locations below, which
    # would otherwise swallow /assets/ and drop these cache headers.
    location ^~ /assets/ {
        # `expires` would emit its own Cache-Control and duplicate this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A request with a file extension is asking for a file, not a route.
    # React Router paths never contain a dot, so serve the real file or 404 --
    # never the SPA shell. Returning HTML to a client that asked for .pem,
    # .js or .map is confusing and masks misconfiguration.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA history fallback: real files win, everything else boots the router.
    # Without this, deep links such as /files/<uuid> or /s/<token> 404 on
    # refresh, because only / exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # This server must never answer for the API. If a routing mistake upstream
    # sends /api here, fail loudly instead of returning index.html, which would
    # hand the client HTML where it expects JSON.
    location /api/ {
        return 404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
